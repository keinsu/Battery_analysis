name: Native desktop EXE
on:
  pull_request:
    paths: ['dqdv/**', '.github/workflows/native-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-desktop-v0.4.2
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r dqdv/requirements-native.txt plotly pytest pyinstaller==6.16.0
      - name: Numerical and selection tests
        run: python -m pytest -q dqdv
      - name: Native source smoke test
        run: python dqdv/native_app.py --self-test native-source.txt
      - name: Build single desktop EXE
        run: python -m PyInstaller --noconfirm --clean dqdv/native.spec
      - name: Verify frozen desktop EXE without Python on PATH
        run: python dqdv/verify_native.py dist/DQDVAnalyzer-Desktop.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Native-desktop-verified
          path: |
            dist/DQDVAnalyzer-Desktop.exe
            native-verification.txt
            native-verification.png
          if-no-files-found: error
      - name: Publish anonymous download
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const repo = context.repo;
            const tag = 'v0.4.2-native';
            const target = context.payload.pull_request?.head.sha || context.sha;
            const data = fs.readFileSync('dist/DQDVAnalyzer-Desktop.exe');
            const digest = crypto.createHash('sha256').update(data).digest('hex');
            let release;
            try { release=(await github.rest.repos.getReleaseByTag({...repo, tag})).data; }
            catch(e) { if(e.status!==404) throw e; }
            if(release && !release.draft) throw new Error('Release already published; do not replace existing executable');
            if(!release) release=(await github.rest.repos.createRelease({...repo, tag_name:tag,target_commitish:target,
              name:'dQ/dV Cycling Desktop v0.4.2 — 독립 실행파일',draft:true,
              body:'브라우저 없이 자체 Windows 창에서 실행하는 데스크톱 프로그램입니다. Python 설치나 별도 폴더 없이 DQDVAnalyzer-Desktop.exe 하나를 실행하세요.\n\nµV(마이크로볼트) 전압 단위를 지원하고, 열 이름 또는 데이터 크기로 V/mV/µV를 자동 선택합니다. 기존 dQ/dV 표시 방식도 포함합니다.\n\nWindows 계산 테스트와 완성된 단일 EXE의 화면 생성·CSV 분석·좌표 표시 검증 통과.\n\nSHA-256: '+digest})).data;
            await github.rest.repos.uploadReleaseAsset({...repo,release_id:release.id,name:'DQDVAnalyzer-Desktop.exe',data,
              headers:{'content-type':'application/octet-stream','content-length':data.length}});
            await github.rest.repos.updateRelease({...repo,release_id:release.id,draft:false});
            core.info('DESKTOP_DOWNLOAD=https://github.com/'+repo.owner+'/'+repo.repo+'/releases/download/'+tag+'/DQDVAnalyzer-Desktop.exe');
